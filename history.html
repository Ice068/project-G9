<body>

    <div class="nav-links">

<section class="hero">

    <h1>History</h1>

    <!-- FORM -->
    <div class="history-box">

        <h2>View your history</h2>

        <form id="historyForm">

            <div class="form-group">
                <label for="reserveNumber">Enter your reserve number :</label>
                <input type="text" id="reserveNumber" name="reserveNumber" required>
            </div>

            <div class="form-group">
                <label for="otp">Enter OTP :</label>
                <input type="text" id="otp" name="otp" required>
            </div>

            <button type="submit" class="submit-btn">
                COMPLETE RESERVATION
            </button>

            <!-- backend message -->
            <p id="formMessage"></p>

        </form>

    </div>

</section>

<script src="history.js"></script>
