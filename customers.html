<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>
    <div class="wrapper">
        <aside id="sidebar">
            <div class="h-100">
                <div class="sidebar-logo">
                    <a href="#">Admin Dashboard</a>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-header">Tools & Components</li>
                    
                    <li class="sidebar-item">
                        <a href="index.html" class="sidebar-link">
                            <i class='bx bx-sliders pe-2'></i> Dashboard
                        </a>
                    </li>
                    
                    <li class="sidebar-item">
                        <a href="Queue.html" class="sidebar-link active">
                            <i class='bx bx-calendar-check pe-2'></i> Manage Queue
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="customers.html" class="sidebar-link active">
                            <i class='bx bx-calendar-check pe-2'></i> Manage Customers
                        </a>
                    </li>
                </ul>
            </div>
        </aside>
        <div class="main">
            <nav class="navbar navbar-expand px-3 border-bottom">
                <button class="btn" type="button" data-bs-theme="dark" id="sidebar-toggle">
                    <i class='bx bx-menu fs-4'></i>
                </button>
                <div class="navbar-collapse navbar">
                    <ul class="navbar-nav ms-auto"> 
                        <li class="nav-item dropdown">
                            <a href="#" data-bs-toggle="dropdown" class="nav-icon pe-md-0">
                                <img src="https://ui-avatars.com/api/?name=Admin+User&background=random" class="avatar img-fluid rounded-circle" alt="profile" style="width: 40px;">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end shadow border-0" style="min-width: 150px;">
                                <a href="#" class="dropdown-item"><i class='bx bx-user me-2'></i> Profile</a>

                                <a href="#" class="dropdown-item text-danger" id="btnLogout"><i class='bx bx-log-out me-2'></i> Logout</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <main class="content px-3 py-2">
                <div class="container-fluid">
                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0">Manage Customers</h4>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-white">
                                    <h6 class="mb-0 fw-bold">ข้อมูลลูกค้า (Customers)</h6>
                                </div>
                                <div class="card-body p-0"> 
                                    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                                        <table class="table table-hover table-bordered mb-0 align-middle">
                                            <thead class="table-light position-sticky top-0" style="z-index: 1;">
                                                <tr>
                                                    <th scope="col" class="text-nowrap">ID</th>
                                                    <th scope="col" class="text-nowrap">ชื่อ</th>
                                                    <th scope="col" class="text-nowrap">Email</th>
                                                    <th scope="col" class="text-nowrap text-center">Password</th>
                                                    <th scope="col" class="text-nowrap text-center" style="width: 100px;">จัดการ</th>
                                                </tr>
                                            </thead>
                                            <tbody id="customer-table-body">
                                                <tr><td colspan="5" class="text-center text-muted py-3">กำลังโหลดข้อมูล...</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        // ฟังก์ชันนำข้อมูลมาสร้างแถวในตาราง
        function loadCustomerTable(data) {
            const tbody = document.getElementById('customer-table-body');
            if (!tbody) return;
            
            tbody.innerHTML = ''; // ล้างข้อความ "กำลังโหลดข้อมูล..."

            // เช็กว่าถ้าไม่มีข้อมูล
            if (data.length === 0) {
                // เปลี่ยน colspan เป็น 5 ให้พอดีกับจำนวนคอลัมน์
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">ไม่มีข้อมูลลูกค้าในระบบ</td></tr>';
                return;
            }

            // ถ้ามีข้อมูล วนลูปสร้างตาราง (ดึงข้อมูล ID, ชื่อ, Email, Password)
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.email}</td>
                    <td class="text-center text-muted">********</td> <td class="text-center">
                        <button class="btn btn-sm btn-warning text-white" onclick="editCustomer('${item.id}')">
                            <i class='bx bx-edit-alt'></i> Edit
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ==========================================
        // จุดเชื่อมต่อกับ Database 
        // ==========================================
        async function fetchCustomersFromDB() {
            try {
                // ตัวอย่างจำลองข้อมูล ถ้าอยากทดสอบว่าตารางขึ้นไหม ให้ลองเอา // ออกจากโค้ดชุดด้านล่าง
                /*
                const data = [
                    { id: "C-001", name: "สมชาย ใจดี", email: "somchai@email.com", password: "123" },
                    { id: "C-002", name: "มานี มีนา", email: "manee@email.com", password: "abc" }
                ];
                */
                
                // ตอนนี้ตั้งค่าเป็น Array ว่าง เพื่อให้ตารางว่างเปล่า รอรับ Database
                const data = []; 
                
                loadCustomerTable(data);
                
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", error);
                document.getElementById('customer-table-body').innerHTML = '<tr><td colspan="5" class="text-center text-danger py-3">เกิดข้อผิดพลาดในการดึงข้อมูลจากฐานข้อมูล</td></tr>';
            }
        }

        // ฟังก์ชันเมื่อกดปุ่ม Edit
        function editCustomer(id) { 
            alert(`เตรียมเปิดหน้าต่างแก้ไขข้อมูลของ ID: ${id}`); 
        }

        // เมื่อโหลดหน้าเว็บเสร็จ ให้เรียกฟังก์ชันดึงข้อมูล
        document.addEventListener('DOMContentLoaded', () => {
            fetchCustomersFromDB();
        });
    </script>
</body>
</html>
