<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECLIPSE | History</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="history_con.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">ECLIPSE</div>

    <div class="nav-links">
        <a href="history_con.html" class="active">History</a>
        <a href="visit-us.html">VISIT US</a>
        <a href="Dining&Drink.html">DINING & DRINKS</a>
        <a href="Reserve Your Table.html">RESERVATIONS</a>
    </div>
</nav>


<!-- TITLE -->
<div class="hero">
    <h1>History</h1>
</div>


<!-- HISTORY SECTION -->
<div class="history-box">

    <div class="history-title">
        Your History
    </div>

    <div class="history-content">

        <!-- LEFT : HISTORY LIST -->
        <div class="left">

            <div id="historyItems" class="history-list">
                <!-- JavaScript จะ render รายการตรงนี้ -->
            </div>

        </div>


        <!-- RIGHT : TOTAL PRICE -->
        <div class="right">

            <div class="total-box">

                <p>
                    <span>Total</span>
                    <span id="totalAmount">0 B</span>
                </p>

                <p>
                    <span>Vat (7%)</span>
                    <span id="vatAmount">0 B</span>
                </p>

                <p>
                    <strong>Grand Total</strong>
                    <strong id="grandTotal">0 B</strong>
                </p>
            </div>
        </div>
    </div>
</div>


<!-- JS -->
<script src="history_con.js" defer></script>

</body>
</html>
