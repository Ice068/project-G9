<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation History</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .table-container { margin-top: 20px; }
    .loading { text-align: center; margin-top: 40px; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Reservation History</h1>
    <p>ข้อมูลการจองจากฐานข้อมูล (รวมชื่อผู้ใช้งาน)</p>

    <div id="loading" class="loading">Loading data...</div>

    <div class="table-responsive table-container" id="historyTableWrapper" style="display: none;">
      <table class="table table-bordered table-striped">
        
        <!-- 🔥 HEADER -->
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Date</th>
            <th>Time</th>
            <th>Guests</th>
            <th>Note</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="historyTableBody"></tbody>
      </table>
    </div>

    <div id="errorMsg" class="alert alert-danger" style="display: none;"></div>

    <a href="Reserve Your Table.html" class="btn btn-primary">
      กลับไปหน้า Reservation
    </a>
  </div>

  <script>
    // ==========================
    // ✅ LOAD DATA
    // ==========================
    async function loadHistory() {
      const loadingEl = document.getElementById('loading');
      const wrapper = document.getElementById('historyTableWrapper');
      const body = document.getElementById('historyTableBody');
      const errorEl = document.getElementById('errorMsg');

      try {
        const res = await fetch('http://localhost:3000/data');
        if (!res.ok) throw new Error('Response status ' + res.status);

        const rows = await res.json();

        if (!Array.isArray(rows)) {
          throw new Error('Unexpected data format');
        }

        if (rows.length === 0) {
          loadingEl.innerText = 'ไม่มีข้อมูลการจอง';
          return;
        }

        body.innerHTML = ""; // เคลียร์ก่อน

        rows.forEach((r, i) => {
          const tr = document.createElement('tr');

          // 🔥 ถ้ายกเลิก → เปลี่ยนสี
          if (r.status === 'cancelled') {
            tr.classList.add('table-danger');
          }

          tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${r.fullname || '(ไม่มีชื่อ)'}</td>
            <td>${r.email || '(ไม่มีอีเมล)'}</td>
            <td>${r.date || '-'}</td>
            <td>${r.time || '-'}</td>
            <td>${r.guests || '-'}</td>
            <td>${r.note || ''}</td>

            <!-- ✅ STATUS -->
            <td>
              ${
                r.status === 'cancelled'
                  ? '❌ ยกเลิกแล้ว'
                  : '✅ ปกติ'
              }
            </td>

            <!-- ✅ BUTTON -->
            <td>
              ${
                r.status === 'cancelled'
                  ? '-'
                  : `<button class="btn btn-danger btn-sm" onclick="cancelReservation(${r.id})">ยกเลิก</button>`
              }
            </td>
          `;

          body.appendChild(tr);
        });

        loadingEl.style.display = 'none';
        wrapper.style.display = 'block';

      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerText = 'Error loading history: ' + err.message;
        console.error(err);
      }
    }

    // ==========================
    // 🔥 CANCEL FUNCTION
    // ==========================
    function cancelReservation(id) {
      if (!confirm("ต้องการยกเลิกการจองใช่ไหม?")) return;

      fetch(`http://localhost:3000/cancel/${id}`, {
        method: "POST"
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        location.reload(); // รีโหลดหน้า
      })
      .catch(err => {
        alert("❌ เกิดข้อผิดพลาด");
        console.error(err);
      });
    }

    // เริ่มโหลด
    loadHistory();
  </script>
</body>
</html>
