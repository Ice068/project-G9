<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECLIPSE | History</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="history.css">
</head>

<body>

<nav class="navbar">
<a href="index.html" class="logo">ECLIPSE</a>

<div class="nav-links">
<a href="history.html" class="active-link">History</a>
<a href="visit-us.html">VISIT US</a>
<a href="Dining&Drink.html">DINING & DRINKS</a>
<a href="Reserve Your Table.html">RESERVATIONS</a>
</div>
</nav>

<section class="hero">

<h1>History</h1>

<div class="history-box">

<h2>View your history</h2>

<form id="historyForm">

<div class="form-group">
<label>Enter your reserve number :</label>
<input type="text" id="reserveNumber" required>
</div>

<div class="form-group">
<label>Email :</label>
<input type="email" id="email" placeholder="example@email.com" required>
</div>

<div class="form-group">
<label>Password :</label>
<input type="password" id="password" required>
</div>

<button type="submit" class="submit-btn">
CHECK RESERVATION
</button>

<p id="formMessage"></p>

</form>

<div id="resultBox" class="result-box" style="display:none;">

<h3>Reservation Detail</h3>

<div id="reservationInfo"></div>

<div class="summary">
<p>Total: <span id="totalAmount">0 B</span></p>
<p>VAT (7%): <span id="vatAmount">0 B</span></p>
<p><strong>Grand Total: <span id="grandTotal">0 B</span></strong></p>
</div>

</div>

</div>

</section>

<script src="history.js"></script>
</body>
</html>
