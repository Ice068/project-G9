<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ECLIPSE | Visit Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Leaflet CSS (Free Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="visit-us.css">
</head>

<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
  <div class="container-fluid px-5">
    <a class="navbar-brand logo" href="index.html">ECLIPSE</a>

    <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <a class="menu-link nav-link" href="history.html">History</a>
      <a class="menu-link nav-link" href="visit-us.html">Visit Us</a>
      <a class="menu-link nav-link" href="Dining&Drink.html">Dining & Drinks</a>
      <a href="Reserve Your Table.html" class="visit-btn">
        RESERVE A TABLE
      </a>
    </div>
  </div>
</nav>

<!-- ===== Visit Section ===== -->
<section class="visit-section container">
    <div class="row g-5 align-items-center">

        <!-- Left Info -->
        <div class="col-lg-5">
            <div class="info-box">
                <h2>Our Location</h2>
                <p>123 Luxury Avenue<br>Bangkok, Thailand</p>

                <h3>Opening Hours</h3>
                <p>Monday – Friday : 17:00 – 23:00</p>
                <p>Saturday – Sunday : 16:00 – 00:00</p>

                <h3>Contact</h3>
                <p>Phone: +66 98 765 4321</p>
                <p>Email: contact@eclipse.com</p>

                <a href="https://www.google.com/maps?q=13.756331,100.501765"
                   target="_blank"
                   class="btn mt-4">
                   Open in Google Maps
                </a>
            </div>
        </div>

        <!-- Right Map -->
        <div class="col-lg-7">
            <div class="map-box">
                <div id="map"></div>
            </div>
        </div>

    </div>
</section>

<!-- ===== Leaflet JS (Free Map) ===== -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([13.756331, 100.501765], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker = L.marker([13.756331, 100.501765]).addTo(map);

    marker.bindPopup(`
        <div style="text-align:center;">
            <h6 style="margin:0;">ECLIPSE Restaurant</h6>
            <p style="margin:0;">Bangkok, Thailand</p>
        </div>
    `).openPopup();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
