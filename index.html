<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Restaurant</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg fixed-top custom-navbar" id="navbar">
  <div class="container-fluid px-5">
    <a class="navbar-brand logo" href="index.html">ECLIPSE</a>

    <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <a class="menu-link nav-link" href="#">History</a>
      <a class="menu-link nav-link" href="#">Visit Us</a>
      <a class="menu-link nav-link" href="Dining&Drink.html">Dining & Drinks</a>
      <a class="reservation-btn" href="Reserve Your Table.html">RESERVATIONS</a>
    </div>
  </div>
</nav>

<!-- ===== Hero Section ===== -->
<section class="hero">
  <div class="hero-content">
    <h1>ECLIPSE</h1>
    <p>FINE DINING EXPERIENCE</p>
    <a href="Reserve Your Table.html" class="hero-btn">RESERVE NOW</a>
  </div>

  <div class="scroll-down">
    SCROLL
  </div>
</section>

<script>
/* เปลี่ยนสี navbar ตอน scroll */
window.addEventListener("scroll", function(){
    const nav = document.getElementById("navbar");
    if(window.scrollY > 50){
        nav.classList.add("nav-scrolled");
    }else{
        nav.classList.remove("nav-scrolled");
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
