<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Reservation Form</h1>
    <form id="reservationForm">
        <input type="text" id="fullname" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <input type="date" id="date" required>
        <input type="time" id="time" required>
        <input type="number" id="guests" placeholder="Number of Guests" min="1" max="10" required>
        <textarea id="note" placeholder="Special Request" rows="3"></textarea>
        <button type="submit">Submit Reservation</button>
    </form>

    <script>
        console.log("✅ index.html โหลดแล้ว");

        document.getElementById("reservationForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            console.log("🔥 Form submitted!");

            const fullname = document.getElementById("fullname").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;
            const guests = document.getElementById("guests").value;
            const note = document.getElementById("note").value;

            if (password !== confirmPassword) {
                alert("Password ไม่ตรงกัน");
                return;
            }

            const data = {
                fullname,
                email,
                password,
                date,
                time,
                guests,
                note
            };

            console.log("📤 ส่งข้อมูล:", data);

            try {
                const res = await fetch("http://localhost:3000/reserve", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                console.log("✅ Result:", result);
                alert("✅ " + result.message);
                document.getElementById("reservationForm").reset();
            } catch (error) {
                console.error("❌ Error:", error);
                alert("❌ Error: " + error.message);
            }
        });
    </script>
</body>
</html>
