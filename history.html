<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECLIPSE | History</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="history.css">
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">ECLIPSE</a>

    <div class="nav-links">
        <a href="history.html" class="active-link">History</a>
        <a href="visit-us.html">VISIT US</a>
        <a href="Dining&Drink.html">DINING & DRINKS</a>
        <a href="Reserve Your Table.html">RESERVATIONS</a>
    </div>
</nav>

<section class="hero">

    <h1>History</h1>

    <!-- FORM -->
    <div class="history-box">

        <h2>View your history</h2>

        <form id="historyForm">

            <div class="form-group">
                <label for="reserveNumber">Enter your reserve number :</label>
                <input type="text" id="reserveNumber" name="reserveNumber" required>
            </div>

            <div class="form-group">
                <label for="otp">Enter OTP :</label>
                <input type="text" id="otp" name="otp" required>
            </div>

            <button type="submit" class="submit-btn">
                COMPLETE RESERVATION
            </button>

            <!-- backend message -->
            <p id="formMessage"></p>

        </form>

    </div>

</section>

<script>
    document.getElementById("historyForm").addEventListener("submit", async function(e) {

    e.preventDefault(); // ไม่ให้รีโหลดหน้า

    const reserveNumber = document.getElementById("reserveNumber").value;
    const otp = document.getElementById("otp").value;
    const message = document.getElementById("formMessage");

    message.innerText = "Processing...";
    message.style.color = "white";

    try {

        const response = await fetch("http://localhost:3000/api/history", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                reserveNumber: reserveNumber,
                otp: otp
            })
        });

        const data = await response.json();

        if(response.ok){
            message.innerText = "Reservation verified successfully!";
            message.style.color = "#d4af37";

            // ตัวอย่าง: redirect
            // window.location.href = "reservation-details.html";

        } else {
            message.innerText = data.message || "Invalid reserve number or OTP";
            message.style.color = "red";
        }

    } catch (error) {
        message.innerText = "Server error. Please try again.";
        message.style.color = "red";
    }

});
</script>
</body>
</html>
