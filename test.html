<!DOCTYPE html>
<html>
<head>
    <title>Test Reservation</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, textarea, button { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button { 
            background: #28a745; 
            color: white; 
            cursor: pointer;
            border: none;
        }
        button:hover { background: #218838; }
        .result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #f0f0f0; 
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 ทดสอบส่งข้อมูล</h1>
    
    <form id="testForm">
        <input type="text" id="fullname" placeholder="ชื่อ" required>
        <input type="email" id="email" placeholder="อีเมล" required>
        <input type="password" id="password" placeholder="รหัสผ่าน" required>
        <input type="date" id="date" required>
        <input type="time" id="time" required>
        <input type="number" id="guests" placeholder="จำนวนผู้" min="1" required>
        <textarea id="note" placeholder="หมายเหตุ" rows="3"></textarea>
        <button type="submit">📤 ส่งข้อมูล</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>
</div>

<script>
    document.getElementById("testForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const data = {
            fullname: document.getElementById("fullname").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            guests: document.getElementById("guests").value,
            note: document.getElementById("note").value
        };

        console.log("📤 ส่งข้อมูล:", data);

        try {
            const response = await fetch("http://localhost:3000/reserve", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            console.log("✅ ผลลัพธ์:", result);

            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<strong>✅ สำเร็จ!</strong><pre>${JSON.stringify(result, null, 2)}</pre>`;
            resultDiv.style.background = "#d4edda";

        } catch (error) {
            console.error("❌ Error:", error);
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<strong>❌ Error:</strong><pre>${error.message}</pre>`;
            resultDiv.style.background = "#f8d7da";
        }
    });
</script>

</body>
</html>
